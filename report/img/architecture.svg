<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1240" height="860" fill="#fbfaf7"/>
  <text x="620" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">Egg Segmentation &amp; Tracking — Pipeline Architecture</text>

  <!-- defs -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>

  <!-- INPUT -->
  <rect x="520" y="66" width="200" height="54" rx="8" fill="#e8e8e8" stroke="#999"/>
  <text x="620" y="90" font-size="15" font-weight="700" text-anchor="middle">INPUT: 110 egg photos</text>
  <text x="620" y="109" font-size="12" text-anchor="middle" fill="#555">640×640, 154 eggs total</text>

  <!-- arrows to task1 & task2 -->
  <line x1="560" y1="120" x2="300" y2="160" stroke="#555" marker-end="url(#arr)"/>
  <line x1="680" y1="120" x2="940" y2="160" stroke="#555" marker-end="url(#arr)"/>

  <!-- ===== TASK 1 (blue) ===== -->
  <rect x="40" y="160" width="520" height="250" rx="10" fill="#eef4fb" stroke="#3b6fb0" stroke-width="1.5"/>
  <text x="60" y="186" font-size="16" font-weight="700" fill="#2c5party">TASK 1 — Pretrained model (pseudo ground truth)</text>
  <text x="60" y="186" font-size="16" font-weight="700" fill="#2c5a9e">TASK 1 — Pretrained model (pseudo ground truth)</text>

  <rect x="70" y="205" width="200" height="56" rx="8" fill="#fff" stroke="#3b6fb0"/>
  <text x="170" y="228" font-size="13.5" font-weight="700" text-anchor="middle">Grounding DINO</text>
  <text x="170" y="247" font-size="11.5" text-anchor="middle" fill="#555">text "egg" → boxes</text>

  <line x1="270" y1="233" x2="330" y2="233" stroke="#555" marker-end="url(#arr)"/>

  <rect x="332" y="205" width="200" height="56" rx="8" fill="#fff" stroke="#3b6fb0"/>
  <text x="432" y="228" font-size="13.5" font-weight="700" text-anchor="middle">SAM</text>
  <text x="432" y="247" font-size="11.5" text-anchor="middle" fill="#555">box → egg mask</text>

  <line x1="300" y1="261" x2="300" y2="300" stroke="#555" marker-end="url(#arr)"/>
  <rect x="150" y="302" width="300" height="56" rx="8" fill="#dbe8f7" stroke="#3b6fb0"/>
  <text x="300" y="325" font-size="13.5" font-weight="700" text-anchor="middle">Ground-truth masks</text>
  <text x="300" y="344" font-size="11.5" text-anchor="middle" fill="#555">binary + instance + overlay</text>
  <text x="300" y="384" font-size="11" text-anchor="middle" fill="#888" font-style="italic">make_masks.py — 154 eggs, 100% images</text>

  <!-- ===== TASK 2 (orange) ===== -->
  <rect x="680" y="160" width="520" height="250" rx="10" fill="#fcf3e8" stroke="#c47f17" stroke-width="1.5"/>
  <text x="700" y="186" font-size="16" font-weight="700" fill="#9a5f0e">TASK 2 — Classical method (our attempt)</text>

  <rect x="710" y="205" width="150" height="56" rx="8" fill="#fff" stroke="#c47f17"/>
  <text x="785" y="228" font-size="13" font-weight="700" text-anchor="middle">GrabCut</text>
  <text x="785" y="246" font-size="11" text-anchor="middle" fill="#555">find object by colour</text>

  <line x1="860" y1="233" x2="898" y2="233" stroke="#555" marker-end="url(#arr)"/>
  <rect x="900" y="205" width="150" height="56" rx="8" fill="#fff" stroke="#c47f17"/>
  <text x="975" y="225" font-size="13" font-weight="700" text-anchor="middle">Shape filter</text>
  <text x="975" y="242" font-size="10.5" text-anchor="middle" fill="#555">solidity / ellipse /</text>
  <text x="975" y="255" font-size="10.5" text-anchor="middle" fill="#555">aspect / area</text>

  <line x1="1050" y1="233" x2="1088" y2="233" stroke="#555" marker-end="url(#arr)"/>
  <rect x="1090" y="205" width="90" height="56" rx="8" fill="#fff" stroke="#c47f17"/>
  <text x="1135" y="228" font-size="12" font-weight="700" text-anchor="middle">Label</text>
  <text x="1135" y="246" font-size="10.5" text-anchor="middle" fill="#555">NMS</text>

  <line x1="940" y1="261" x2="940" y2="300" stroke="#555" marker-end="url(#arr)"/>
  <rect x="790" y="302" width="300" height="56" rx="8" fill="#f7e6cc" stroke="#c47f17"/>
  <text x="940" y="325" font-size="13.5" font-weight="700" text-anchor="middle">Predicted masks</text>
  <text x="940" y="344" font-size="11.5" text-anchor="middle" fill="#555">binary + instance + overlay</text>
  <text x="940" y="384" font-size="11" text-anchor="middle" fill="#888" font-style="italic">segment.py — NO training, hand-written rules</text>

  <!-- arrows into Task3 -->
  <line x1="300" y1="410" x2="520" y2="455" stroke="#555" marker-end="url(#arr)"/>
  <text x="330" y="440" font-size="11" fill="#2c5a9e" font-weight="700">ground truth</text>
  <line x1="940" y1="410" x2="720" y2="455" stroke="#555" marker-end="url(#arr)"/>
  <text x="820" y="440" font-size="11" fill="#9a5f0e" font-weight="700">predictions</text>

  <!-- ===== TASK 3 (green) ===== -->
  <rect x="360" y="458" width="520" height="150" rx="10" fill="#edf6ee" stroke="#3a8a46" stroke-width="1.5"/>
  <text x="380" y="484" font-size="16" font-weight="700" fill="#2b6b34">TASK 3 — Evaluation (compare the two masks)</text>
  <rect x="385" y="500" width="230" height="44" rx="7" fill="#fff" stroke="#3a8a46"/>
  <text x="500" y="520" font-size="12.5" font-weight="700" text-anchor="middle">IoU = overlap ÷ union</text>
  <text x="500" y="537" font-size="11" text-anchor="middle" fill="#555">Dice, Precision, Recall, Boundary-F1</text>
  <rect x="625" y="500" width="230" height="44" rx="7" fill="#fff" stroke="#3a8a46"/>
  <text x="740" y="520" font-size="12.5" font-weight="700" text-anchor="middle">Failure analysis</text>
  <text x="740" y="537" font-size="11" text-anchor="middle" fill="#555">worst cases + plots</text>
  <text x="620" y="580" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6b34">Result: dev IoU 0.47 · recall 0.86  (classical vs SAM)</text>
  <text x="620" y="598" font-size="11" text-anchor="middle" fill="#888" font-style="italic">evaluate.py — gap concentrated in white-on-white / in-water cases</text>

  <!-- ===== TASK 4 (purple) ===== -->
  <rect x="40" y="650" width="1160" height="175" rx="10" fill="#f3eefb" stroke="#6a44a8" stroke-width="1.5"/>
  <text x="60" y="676" font-size="16" font-weight="700" fill="#4e2f82">TASK 4 — Video tracking  (separate 60s video, not the 110 photos)</text>

  <rect x="70" y="700" width="180" height="60" rx="8" fill="#fff" stroke="#6a44a8"/>
  <text x="160" y="724" font-size="13" font-weight="700" text-anchor="middle">Video → frames</text>
  <text x="160" y="743" font-size="11" text-anchor="middle" fill="#555">1440 frames (24 fps)</text>

  <line x1="250" y1="730" x2="298" y2="730" stroke="#555" marker-end="url(#arr)"/>
  <rect x="300" y="700" width="210" height="60" rx="8" fill="#fff" stroke="#6a44a8"/>
  <text x="405" y="722" font-size="13" font-weight="700" text-anchor="middle">Fast segmentation</text>
  <text x="405" y="740" font-size="10.5" text-anchor="middle" fill="#555">whiteness + smoothness</text>
  <text x="405" y="753" font-size="10.5" text-anchor="middle" fill="#555">(no GrabCut — too slow)</text>

  <line x1="510" y1="730" x2="558" y2="730" stroke="#555" marker-end="url(#arr)"/>
  <rect x="560" y="700" width="210" height="60" rx="8" fill="#fff" stroke="#6a44a8"/>
  <text x="665" y="722" font-size="13" font-weight="700" text-anchor="middle">SORT tracker</text>
  <text x="665" y="740" font-size="10.5" text-anchor="middle" fill="#555">Kalman predict +</text>
  <text x="665" y="753" font-size="10.5" text-anchor="middle" fill="#555">IoU-Hungarian match</text>

  <line x1="770" y1="730" x2="818" y2="730" stroke="#555" marker-end="url(#arr)"/>
  <rect x="820" y="700" width="210" height="60" rx="8" fill="#e7dcf7" stroke="#6a44a8"/>
  <text x="925" y="724" font-size="13" font-weight="700" text-anchor="middle">Tracked video</text>
  <text x="925" y="743" font-size="11" text-anchor="middle" fill="#555">each egg = own ID + colour</text>

  <text x="620" y="805" font-size="11" text-anchor="middle" fill="#888" font-style="italic">track.py — "Egg 1", "Egg 2" followed across frames; max_age bridges hand occlusions</text>

  <!-- legend of no-training -->
  <rect x="40" y="66" width="200" height="54" rx="8" fill="#fff" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="140" y="88" font-size="12" font-weight="700" text-anchor="middle" fill="#444">No model is trained</text>
  <text x="140" y="106" font-size="10.5" text-anchor="middle" fill="#777">Task1 = pretrained · Task2 = rules</text>
</svg>
